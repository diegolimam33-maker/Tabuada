<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Verificador de Idade</title>
</head>
<body>
    <header>    
        <h1>Verificador de Idade</h1>
    </header>
    <section>   
        <div>
            <p> Ano de Nascimento: </p>
            <input type="number" name="txtano" id="txtano" min="0">
            <p> Sexo: </p>
            <input type="radio" name="radsex" id="masc" value="masc" checked>
            <label for="masc">Masculino</label>
            <input type="radio" name="radsex" id="fem" value="fem">
            <label for="fem">Feminino</label>

            <input type="button" value="Verificar" id="btnverificar" onclick="verificar()">
        </div>

        <div id = "res">
            Preencha os dados e clique no botão "Verificar"!
            
            
        </div>
    </section>
    <footer>
        <p>&copy; 2026 DiegoMiranda</p>
    </footer>
    <script src="script.js"></script>


</body>
</html>
